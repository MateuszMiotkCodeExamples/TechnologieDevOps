services:
  syntax_tester:
    image: alpine:latest
    environment:
      # Zmiana nazw zmiennych na krótsze dla przejrzystości
      VAR_A: "${VAR_A:-Wartość domyślna A}"
      VAR_B: "${VAR_B-Wartość domyślna B}"
      VAR_C: "${VAR_C:?Błąd: VAR_C brak lub pusta}"
      VAR_D: "${VAR_D?Błąd: VAR_D nie ustawiona}"
    command: |
      sh -c 'echo "--- Demo Składni ---" &&
             echo "A (domyślna dla pustej): $VAR_A" &&
             echo "B (domyślna dla nieustawionej): $VAR_B" &&
             echo "C (wymagana niepusta): $VAR_C" &&
             echo "D (wymagana ustawiona): $VAR_D" &&
             echo "--- Sprawdzenie wszystkich zmiennych ---" &&
             env | grep VAR_ &&
             echo "--------------------" &&
             sleep infinity'