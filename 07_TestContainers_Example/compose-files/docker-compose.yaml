# ./compose-files/docker-compose.yml
version: '3.8'
services:
  redis-svc:
    image: redis:7-alpine
    ports: [ "6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 5
  api-svc:
    image: alpine:latest
    command: [ "sh", "-c", "echo \"API_MODE=$API_MODE\"; sleep infinity" ]
    environment:
      - API_MODE=${API_MODE:-production}
  debugger-svc:
    image: alpine:latest
    command: ["echo", "Debugger active"]
    profiles: [debug]